<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>불규칙동사 연습 · Irregular Verbs</title>
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#1d2a2e;--sub:#5c6b70;--line:#d9d4c7;--main:#0f5f6b;--mainink:#fff;--ok:#1c7a43;--okbg:#dff3e6;--bad:#b3261e;--badbg:#fbe3e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12191b;--card:#1c2629;--ink:#eef2f1;--sub:#a3b2b5;--line:#33434a;--main:#58c0cf;--mainink:#08272c;--ok:#7fdca2;--okbg:#17382444;--bad:#ff9a92;--badbg:#44211e}}
:root[data-theme="dark"]{--bg:#12191b;--card:#1c2629;--ink:#eef2f1;--sub:#a3b2b5;--line:#33434a;--main:#58c0cf;--mainink:#08272c;--ok:#7fdca2;--okbg:#17382444;--bad:#ff9a92;--badbg:#44211e}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:12px 2px;font-size:15px;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px}
.tabs button.on{background:var(--main);color:var(--mainink);border-color:var(--main)}
select{width:100%;padding:12px;font-size:17px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:12px}
.prog{display:flex;justify-content:space-between;color:var(--sub);font-size:16px;margin-bottom:6px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--main)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:24px 18px;text-align:center}
.ko{font-size:22px;color:var(--sub)}.big{font-size:44px;font-weight:800;margin:4px 0 10px;color:var(--main)}
.forms{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.forms div{background:var(--bg);border-radius:12px;padding:10px 4px}.forms small{display:block;color:var(--sub);font-size:14px}.forms b{font-size:28px}
.hint{color:var(--sub);margin:14px 0 0}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:16px 8px;font-size:19px;font-weight:700;border-radius:14px;border:2px solid var(--main);background:var(--main);color:var(--mainink)}
.btn.alt{background:var(--card);color:var(--main)}.btn.no{background:var(--card);color:var(--bad);border-color:var(--bad)}.btn.yes{background:var(--ok);border-color:var(--ok);color:#fff}
label{display:block;text-align:left;font-size:16px;color:var(--sub);margin:12px 0 4px}
input{width:100%;padding:14px;font-size:24px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input.ok{border-color:var(--ok);background:var(--okbg)}input.bad{border-color:var(--bad);background:var(--badbg)}
.ans{font-size:16px;margin-top:4px;text-align:left;color:var(--bad)}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{padding:16px;font-size:26px;font-weight:700;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.q{font-size:20px;margin-top:6px}
.fin{font-size:20px}.fin b{font-size:40px;display:block;color:var(--main)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--main);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<h1>불규칙동사 연습 Irregular Verbs</h1>
<div class="tabs" id="tabs">
<button data-m="card" class="on">카드 Cards</button>
<button data-m="write">쓰기 Type</button>
<button data-m="pick">고르기 Pick</button>
<button data-m="spell">스펠링 Spell</button>
</div>
<select id="range" aria-label="범위">
<option value="all">전체 1–100</option>
<option value="1-25">1–25번</option>
<option value="26-50">26–50번</option>
<option value="51-75">51–75번</option>
<option value="76-100">76–100번</option>
<option value="missed">틀린 단어만 Missed</option>
</select>
<div id="main"></div>
</div>
<script>
const D=`awake|awoke|awaken|깨우다
be|was/were|been|~이다
beat|beat|beaten|치다
begin|began|begun|시작하다
bite|bit|bitten|물다
blow|blew|blown|불다
break|broke|broken|깨뜨리다
bring|brought|brought|가져오다
build|built|built|짓다
buy|bought|bought|사다
catch|caught|caught|잡다
choose|chose|chosen|선택하다
come|came|come|오다
cost|cost|cost|비용이 들다
cut|cut|cut|자르다
do|did|done|하다
deal|dealt|dealt|다루다
dig|dug|dug|파다
dream|dreamt|dreamt|꿈을 꾸다
draw|drew|drawn|그리다
drink|drank|drunk|마시다
drive|drove|driven|운전하다
eat|ate|eaten|먹다
fall|fell|fallen|떨어지다
feed|fed|fed|먹이주다
feel|felt|felt|느끼다
fight|fought|fought|싸우다
find|found|found|찾다
fly|flew|flown|날다
forget|forgot|forgotten|잊다
forgive|forgave|forgiven|용서하다
freeze|froze|frozen|얼다
get|got|gotten|얻다
give|gave|given|주다
go|went|gone|가다
grow|grew|grown|자라다
hang|hung|hung|걸다
have|had|had|가지다
hear|heard|heard|듣다
hide|hid|hidden|숨기다
hit|hit|hit|치다
hold|held|held|잡다
hurt|hurt|hurt|아프다
keep|kept|kept|유지하다
know|knew|known|알다
lay|laid|laid|눕히다
lead|led|led|이끌다
leave|left|left|떠나다
lend|lent|lent|빌려주다
let|let|let|허락하다
lie|lay|lain|눕다
lose|lost|lost|잃다
make|made|made|만들다
mean|meant|meant|의미하다
meet|met|met|만나다
pay|paid|paid|지불하다
put|put|put|놓다
quit|quit|quit|그만두다
read|read|read|읽다
ride|rode|ridden|타다
ring|rang|rung|울리다
rise|rose|risen|오르다
run|ran|run|달리다
say|said|said|말하다
see|saw|seen|보다
seek|sought|sought|찾다
sell|sold|sold|팔다
send|sent|sent|보내다
set|set|set|놓다
sew|sewed|sewn|꿰매다
shake|shook|shaken|흔들다
shine|shone|shone|빛나다
shoot|shot|shot|쏘다
show|showed|shown|보여주다
sing|sang|sung|노래하다
sink|sank|sunk|가라앉다
sit|sat|sat|앉다
sleep|slept|slept|자다
slide|slid|slid|미끄러지다
speak|spoke|spoken|말하다
spend|spent|spent|쓰다
spread|spread|spread|펼치다
stand|stood|stood|서다
steal|stole|stolen|훔치다
stick|stuck|stuck|찌르다
strike|struck|stricken|치다
swear|swore|sworn|맹세하다
sweep|swept|swept|쓸다
swell|swelled|swollen|팽창하다
swim|swam|swum|수영하다
swing|swung|swung|흔들리다
take|took|taken|가져가다
teach|taught|taught|가르치다
tear|tore|torn|찢다
tell|told|told|말하다
think|thought|thought|생각하다
wear|wore|worn|입다
weep|wept|wept|울다
win|won|won|이기다
write|wrote|written|쓰다`.split('\n').map((l,i)=>{const[b,p,pp,k]=l.split('|');return{n:i+1,b,p,pp,k}});

const $=s=>document.querySelector(s),main=$('#main');
let missed=new Set();
try{missed=new Set(JSON.parse(localStorage.getItem('iv_missed')||'[]'))}catch(e){}
function save(){try{localStorage.setItem('iv_missed',JSON.stringify([...missed]))}catch(e){}}
let mode='card',pool=[],i=0,sc={r:0,w:0},flip=false,done=false,opts=[],qf='p',hl=false;
const shuf=a=>{a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.random()*(j+1)|0;[a[j],a[k]]=[a[k],a[j]]}return a};
const norm=s=>s.trim().toLowerCase();
const good=(a,t)=>{a=norm(a);return !!a&&(a===t||t.split('/').includes(a))};
function say(t){try{const u=new SpeechSynthesisUtterance(t.replace('/',' or '));u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function start(){
  const r=$('#range').value;let a;
  if(r==='all')a=D;else if(r==='missed')a=D.filter(v=>missed.has(v.n));
  else{const[s,e]=r.split('-').map(Number);a=D.filter(v=>v.n>=s&&v.n<=e)}
  if(!a.length){a=D;$('#range').value='all'}
  pool=shuf(a);i=0;sc={r:0,w:0};flip=false;done=false;newQ();render();
}
function newQ(){
  done=false;flip=false;hl=false;qf=Math.random()<.5?'p':'pp';
  const v=pool[i];if(!v)return;
  const t=v[qf],others=shuf(D.filter(x=>x.n!==v.n&&x[qf]!==t).map(x=>x[qf]));
  opts=shuf([t,...[...new Set(others)].slice(0,3)]);
}
function rec(v,ok){if(ok){sc.r++;missed.delete(v.n)}else{sc.w++;missed.add(v.n)}save()}
function next(){i++;newQ();render()}
function render(){
  if(i>=pool.length){
    main.innerHTML=`<div class="card fin">끝! Finished<b>${sc.r} / ${sc.r+sc.w}</b>${sc.w?`틀린 단어 ${sc.w}개는 저장되었어요.<br>범위에서 “틀린 단어만”을 골라 다시 연습하세요.`:'모두 맞았어요! 잘했어요!'}<div class="row"><button class="btn" onclick="start()">다시 하기 Again</button></div></div>`;return;
  }
  const v=pool[i],pct=i/pool.length*100;
  let h=`<div class="prog"><span>${i+1} / ${pool.length}</span><span>✔ ${sc.r} ✘ ${sc.w}</span></div><div class="bar"><i style="width:${pct}%"></i></div>`;
  if(mode==='card'){
    h+=`<div class="card" onclick="flip=true;render()"><div class="ko">${v.k}</div><div class="big">${v.b}</div>`+
    (flip?`<div class="forms"><div><small>과거 Past</small><b>${v.p}</b></div><div><small>과거분사 Participle</small><b>${v.pp}</b></div></div>`:`<p class="hint">카드를 눌러 답 보기<br>Tap to see the answer</p>`)+`</div>`;
    h+=flip?`<div class="row"><button class="btn alt" onclick="say('${v.b}, ${v.p}, ${v.pp}')">🔊 듣기</button></div><div class="row"><button class="btn no" onclick="rec(pool[i],false);next()">몰라요</button><button class="btn yes" onclick="rec(pool[i],true);next()">알아요</button></div>`:'';
  }else if(mode==='write'){
    h+=`<div class="card"><div class="ko">${v.k}</div><div class="big">${v.b}</div>
    <label for="a1">과거 Past</label><input id="a1" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ${done?'disabled':''}>
    <div class="ans" id="e1"></div>
    <label for="a2">과거분사 Past participle</label><input id="a2" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ${done?'disabled':''}>
    <div class="ans" id="e2"></div></div>
    <div class="row">${done?`<button class="btn alt" onclick="say('${v.b}, ${v.p}, ${v.pp}')">🔊 듣기</button><button class="btn" onclick="next()">다음 Next</button>`:`<button class="btn" onclick="check()">확인 Check</button>`}</div>`;
  }else if(mode==='spell'){
    const t=v[qf],bl=t.replace(/[a-z]/g,'_ ');
    h+=`<div class="card"><div class="ko">${v.k}</div><div class="big">${v.b}</div><div class="q">${qf==='p'?'과거 Past':'과거분사 Past participle'} 스펠링을 쓰세요</div><div class="big" id="hn" style="font-size:30px;letter-spacing:3px;color:var(--ink)">${bl}</div><input id="s1" aria-label="스펠링" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><div class="ans" id="e1"></div><p class="hint">🔊를 눌러 단어를 듣고 철자를 써 보세요.<br>Tap 🔊, listen, then spell it.</p></div><div class="row"><button class="btn alt" onclick="say('${t}')">🔊 듣기</button><button class="btn alt" onclick="showH()">힌트</button><button class="btn" onclick="chkS()">확인</button></div>`;
  }else{
    const t=v[qf];
    h+=`<div class="card"><div class="ko">${v.k}</div><div class="big">${v.b}</div><div class="q">${qf==='p'?'과거 Past':'과거분사 Past participle'}?</div></div><div class="opts">`+
    opts.map(o=>`<button class="opt" data-o="${o}" onclick="pick(this)" ${done?'disabled':''}>${o}</button>`).join('')+`</div>`+(done?`<div class="row"><button class="btn" onclick="next()">다음 Next</button></div>`:'');
  }
  main.innerHTML=h;
  if(mode==='spell'){const s=$('#s1');s.onkeydown=e=>{if(e.key==='Enter'&&!done)chkS()};s.focus({preventScroll:true})}
  if(mode==='write'&&!done){const a=$('#a1');a.focus({preventScroll:true});a.onkeydown=e=>{if(e.key==='Enter')$('#a2').focus()};$('#a2').onkeydown=e=>{if(e.key==='Enter')check()}}
}
function check(){
  const v=pool[i],a1=$('#a1'),a2=$('#a2');
  const o1=good(a1.value,v.p),o2=good(a2.value,v.pp);
  a1.className=o1?'ok':'bad';a2.className=o2?'ok':'bad';
  if(!o1)$('#e1').textContent='정답 Answer: '+v.p;
  if(!o2)$('#e2').textContent='정답 Answer: '+v.pp;
  rec(v,o1&&o2);done=true;a1.disabled=a2.disabled=true;
  const r=document.querySelector('.row');r.innerHTML=`<button class="btn alt" onclick="say('${v.b}, ${v.p}, ${v.pp}')">🔊 듣기</button><button class="btn" onclick="next()">다음 Next</button>`;
  $('#e2').scrollIntoView({block:'center'});
}
function showH(){if(done)return;const t=pool[i][qf];$('#hn').textContent=t[0]+t.replace(/[a-z]/g,'_ ').slice(2)}
function chkS(){
  if(done)return;const v=pool[i],t=v[qf],a=$('#s1'),ok=good(a.value,t);
  a.className=ok?'ok':'bad';$('#hn').textContent=t;if(!ok)$('#e1').textContent='정답 Answer: '+t;
  rec(v,ok);done=true;a.disabled=true;
  document.querySelector('.row').innerHTML=`<button class="btn alt" onclick="say('${t}')">🔊 듣기</button><button class="btn" onclick="next()">다음 Next</button>`;
  document.querySelector('.prog span:last-child').textContent=`✔ ${sc.r} ✘ ${sc.w}`;say(t);
}
function pick(b){
  const v=pool[i],t=v[qf];done=true;rec(v,b.dataset.o===t);
  document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.o===t)x.classList.add('ok');else if(x===b)x.classList.add('bad')});
  main.insertAdjacentHTML('beforeend',`<div class="row"><button class="btn alt" onclick="say('${v.b}, ${v.p}, ${v.pp}')">🔊 듣기</button><button class="btn" onclick="next()">다음 Next</button></div>`);
  document.querySelector('.prog span:last-child').textContent=`✔ ${sc.r} ✘ ${sc.w}`;
}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));start()};
$('#range').onchange=start;
start();
</script>
</body>
</html>
